<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- PC Case -->
  <g transform="translate(200, 50)" filter="url(#glow1)">
    <!-- Main body -->
    <rect x="0" y="0" width="120" height="180" rx="8" fill="#1a1a2e" stroke="url(#pcGrad1)" stroke-width="2"/>
    
    <!-- Glass panel -->
    <rect x="10" y="10" width="100" height="120" rx="4" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1"/>
    
    <!-- RGB Fans -->
    <circle cx="35" cy="40" r="20" fill="none" stroke="url(#pcGrad1)" stroke-width="2" opacity="0.8"/>
    <circle cx="35" cy="40" r="15" fill="none" stroke="url(#pcGrad1)" stroke-width="1" opacity="0.6"/>
    <circle cx="35" cy="40" r="10" fill="none" stroke="url(#pcGrad1)" stroke-width="1" opacity="0.4"/>
    
    <circle cx="75" cy="40" r="20" fill="none" stroke="url(#pcGrad1)" stroke-width="2" opacity="0.8"/>
    <circle cx="75" cy="40" r="15" fill="none" stroke="url(#pcGrad1)" stroke-width="1" opacity="0.6"/>
    <circle cx="75" cy="40" r="10" fill="none" stroke="url(#pcGrad1)" stroke-width="1" opacity="0.4"/>
    
    <circle cx="35" cy="90" r="20" fill="none" stroke="url(#pcGrad1)" stroke-width="2" opacity="0.8"/>
    <circle cx="35" cy="90" r="15" fill="none" stroke="url(#pcGrad1)" stroke-width="1" opacity="0.6"/>
    <circle cx="35" cy="90" r="10" fill="none" stroke="url(#pcGrad1)" stroke-width="1" opacity="0.4"/>
    
    <!-- GPU visible through glass -->
    <rect x="50" y="75" width="50" height="12" rx="2" fill="#2d2d2d"/>
    <rect x="52" y="77" width="46" height="8" rx="1" fill="url(#pcGrad1)" opacity="0.6"/>
    
    <!-- Front panel details -->
    <rect x="45" y="145" width="30" height="3" rx="1" fill="url(#pcGrad1)" opacity="0.8"/>
    <circle cx="60" cy="160" r="8" fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <circle cx="60" cy="160" r="3" fill="url(#pcGrad1)"/>
  </g>
  
  <!-- Glow effect -->
  <ellipse cx="260" cy="140" rx="80" ry="60" fill="url(#pcGrad1)" opacity="0.2" filter="url(#glow1)"/>
</svg>