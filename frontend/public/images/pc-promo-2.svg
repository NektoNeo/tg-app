<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- PC Case -->
  <g transform="translate(200, 50)" filter="url(#glow2)">
    <!-- Main body -->
    <rect x="0" y="0" width="120" height="180" rx="8" fill="#1a1a2e" stroke="url(#pcGrad2)" stroke-width="2"/>
    
    <!-- Front mesh -->
    <rect x="10" y="10" width="100" height="100" rx="4" fill="rgba(59, 130, 246, 0.1)"/>
    <path d="M15 15 L105 15 M15 25 L105 25 M15 35 L105 35 M15 45 L105 45 M15 55 L105 55 M15 65 L105 65 M15 75 L105 75 M15 85 L105 85 M15 95 L105 95 M15 105 L105 105" stroke="rgba(96, 165, 250, 0.2)" stroke-width="0.5"/>
    
    <!-- RGB Strip -->
    <rect x="5" y="50" width="3" height="60" rx="1" fill="url(#pcGrad2)" opacity="0.9"/>
    <rect x="112" y="50" width="3" height="60" rx="1" fill="url(#pcGrad2)" opacity="0.9"/>
    
    <!-- Logo area -->
    <circle cx="60" cy="60" r="25" fill="none" stroke="url(#pcGrad2)" stroke-width="2" opacity="0.6"/>
    <text x="60" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#pcGrad2)" text-anchor="middle">VA</text>
    
    <!-- Bottom panel -->
    <rect x="10" y="120" width="100" height="50" rx="4" fill="#2d2d2d"/>
    
    <!-- Power button -->
    <circle cx="60" cy="145" r="10" fill="none" stroke="rgba(96, 165, 250, 0.6)" stroke-width="2"/>
    <circle cx="60" cy="145" r="6" fill="url(#pcGrad2)" opacity="0.8"/>
    
    <!-- USB ports -->
    <rect x="25" y="160" width="20" height="4" rx="1" fill="rgba(96, 165, 250, 0.4)"/>
    <rect x="75" y="160" width="20" height="4" rx="1" fill="rgba(96, 165, 250, 0.4)"/>
  </g>
  
  <!-- Glow effect -->
  <ellipse cx="260" cy="140" rx="80" ry="60" fill="url(#pcGrad2)" opacity="0.2" filter="url(#glow2)"/>
</svg>