<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4C1D95;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="gradB" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#E9D5FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B794F4;stop-opacity:0.5" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#gradA)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="400" y2="50" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="250" x2="400" y2="250" stroke="white" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="300" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="white" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="300" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="300" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="white" stroke-width="1"/>
    <line x1="350" y1="0" x2="350" y2="300" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Shopping cart icon stylized -->
  <g transform="translate(160, 100)">
    <circle cx="40" cy="60" r="50" fill="url(#gradB)" opacity="0.3" filter="url(#blur)"/>
    <path d="M20 20 L30 20 L35 50 L55 50 L60 30 L35 30" stroke="white" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="58" r="3" fill="white" opacity="0.9"/>
    <circle cx="52" cy="58" r="3" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Decorative elements -->
  <rect x="50" y="200" width="80" height="2" fill="white" opacity="0.3">
    <animate attributeName="width" values="80;120;80" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="270" y="80" width="60" height="2" fill="white" opacity="0.3">
    <animate attributeName="width" values="60;90;60" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>