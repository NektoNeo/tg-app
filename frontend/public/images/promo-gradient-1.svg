<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B794F4;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="400" height="300" fill="url(#grad1)"/>
  
  <!-- Floating shapes -->
  <circle cx="100" cy="80" r="60" fill="url(#grad2)" opacity="0.6" filter="url(#glow)">
    <animate attributeName="cy" values="80;100;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="300" cy="200" r="80" fill="url(#grad2)" opacity="0.4" filter="url(#glow)">
    <animate attributeName="cx" values="300;320;300" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- PC Icon stylized -->
  <g transform="translate(170, 120)" filter="url(#glow)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <rect x="5" y="5" width="50" height="30" rx="2" fill="white" opacity="0.2"/>
    <rect x="15" y="50" width="30" height="5" rx="2" fill="white" opacity="0.8"/>
    <rect x="5" y="55" width="50" height="3" rx="1" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Decorative lines -->
  <path d="M50 250 Q 200 200 350 250" stroke="white" stroke-width="1" opacity="0.3" fill="none"/>
  <path d="M80 270 Q 200 240 320 270" stroke="white" stroke-width="1" opacity="0.2" fill="none"/>
</svg>